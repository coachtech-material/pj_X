site_name: estra AI研修カリキュラム
site_description: 非エンジニアが Claude Code に業務を委任し、実務の成果物を仕上げるための研修カリキュラム。
site_url: https://coachtech-material.github.io/pj_X/

docs_dir: docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon: {}

extra:
  generator: false

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - トップ: index.md
  - Part 1 導入:
    - Chapter 1 AIに業務を任せる:
      - 1-1-1 なぜ今AIに業務を任せるのか: part-01/chapter-01/1-1-1.md
      - 1-1-2 チャットAIとAIエージェントの違い: part-01/chapter-01/1-1-2.md
    - Chapter 2 セットアップと最初の成果物:
      - 1-2-1 Claude Code のインストールと認証: part-01/chapter-02/1-2-1.md
      - 1-2-2 小さなタスクで最初の成果物を出す: part-01/chapter-02/1-2-2.md
    - Chapter 3 AIに任せる思考とプロンプト:
      - 1-3-1 ブログ記事を丸投げする: part-01/chapter-03/1-3-1.md
      - 1-3-2 プロンプトのフレームワークとAIに任せるリスク: part-01/chapter-03/1-3-2.md
      - 1-3-3 仮説で当てる: part-01/chapter-03/1-3-3.md
